<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Review Form</title>
  <meta name="description" content="Product Review Form for submitting feedback on products. Please fill out the required fields and submit your review.">
  <meta name="author" content="Raphael Omonayin">
  <link rel="stylesheet" href="styles/form.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap');">
  <script src="scripts/products.js"></script>
  <script src="scripts/form.js"></script>
</head>
<body>

  <main class="ticket">
    <div class="ticket-header">
      <div class="eyebrow">
        <span>Form No. 07-A</span>
        <span>Consumer Feedback Unit</span>
      </div>
      <h1 class="ticket-title">Product Review</h1>
      <p class="ticket-sub">Tell us how the product performed. Fields marked <span class="required-tag">*</span> are required.</p>
      <div class="stamp" aria-hidden="true">Quality<br>Checked</div>
    </div>

    <form action="review.html" method="get">

      <div class="field field-row">
        <label class="field-label" for="product">Product<span class="required-tag">*</span></label>
        <select id="product" name="product" required>
          <option value="" disabled selected>Select a Product ...</option>
          <!-- Remaining options are generated by js/form.js from the products array -->
        </select>
      </div>

      <div class="field field-row">
        <span class="group-label" id="rating-group-label">Overall Rating<span class="required-tag">*</span></span>
        <div>
          <div class="stars" role="radiogroup" aria-labelledby="rating-group-label">
            <input type="radio" id="rating-5" name="rating" value="5" required>
            <label for="rating-5" title="5 stars">&star;</label>

            <input type="radio" id="rating-4" name="rating" value="4">
            <label for="rating-4" title="4 stars">&star;</label>

            <input type="radio" id="rating-3" name="rating" value="3">
            <label for="rating-3" title="3 stars">&star;</label>

            <input type="radio" id="rating-2" name="rating" value="2">
            <label for="rating-2" title="2 stars">&star;</label>

            <input type="radio" id="rating-1" name="rating" value="1">
            <label for="rating-1" title="1 star">&star;</label>
          </div>
          <p class="rating-hint">1 = poor &middot; 5 = excellent</p>
        </div>
      </div>

      <div class="field field-row">
        <label class="field-label" for="install-date">Date Installed<span class="required-tag">*</span></label>
        <input type="date" id="install-date" name="installDate" required>
      </div>

      <div class="field field-row">
        <span class="group-label" id="features-group-label">Useful Features</span>
        <div class="checkbox-grid" role="group" aria-labelledby="features-group-label">
          <div class="checkbox-item">
            <input type="checkbox" id="feature-durability" name="features" value="durability">
            <label for="feature-durability">Durability</label>
          </div>
          <div class="checkbox-item">
            <input type="checkbox" id="feature-ease" name="features" value="ease-of-use">
            <label for="feature-ease">Ease of Use</label>
          </div>
          <div class="checkbox-item">
            <input type="checkbox" id="feature-performance" name="features" value="performance">
            <label for="feature-performance">Performance</label>
          </div>
          <div class="checkbox-item">
            <input type="checkbox" id="feature-design" name="features" value="design">
            <label for="feature-design">Design</label>
          </div>
        </div>
      </div>

      <div class="field field-row">
        <label class="field-label" for="review">Written Review <span class="optional-tag">(optional)</span></label>
        <textarea id="review" name="review" placeholder="What worked well? What didn't?"></textarea>
      </div>

      <div class="field field-row">
        <label class="field-label" for="username">Your Name <span class="optional-tag">(optional)</span></label>
        <input type="text" id="username" name="username" placeholder="Jane Doe">
      </div>

      <div class="submit-row">
        <input type="submit" value="Post Review">
      </div>

    </form>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 ♠️ Raphael Omonayin &middot; Nigeria ♠️ </p>
    <p>Last Modification: 08/01/2026</p>
  </footer>
</body>
</html>

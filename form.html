<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Review Form</title>
  <meta name="description" content="Product Review Form for submitting feedback on products. Please fill out the required fields and submit your review.">
  <meta name="author" content="Raphael Omonayin">
  <link rel="stylesheet" href="styles/form.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap');">
  <script src="scripts/products.js" defer></script>
  <script src="scripts/form.js" defer></script>
</head>
<body>

  <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <form action="review.html" method="get" id="reviewForm">
            <div class="form-group">
                <label for="productName">Product Name</label>
                <select id="productName" name="productName" required>
                    <option value="" disabled selected>Select a Product …</option>
                </select>
            </div>

            <div class="form-group">
                <label>Overall Rating</label>
                <div class="star-rating">
                    <input type="radio" id="star5" name="rating" value="5" required />
                    <label for="star5" title="5 stars">★</label>

                    <input type="radio" id="star4" name="rating" value="4" />
                    <label for="star4" title="4 stars">★</label>

                    <input type="radio" id="star3" name="rating" value="3" />
                    <label for="star3" title="3 stars">★</label>

                    <input type="radio" id="star2" name="rating" value="2" />
                    <label for="star2" title="2 stars">★</label>

                    <input type="radio" id="star1" name="rating" value="1" />
                    <label for="star1" title="1 star">★</label>
                </div>
                <p class="helper-text">* All radio buttons share the same <code>name="rating"</code> to ensure only one rating can be selected.</p>
            </div>

            <div class="form-group">
                <label for="installDate">Date of Installation</label>
                <input type="date" id="installDate" name="installDate" required />
            </div>

            <div class="form-group">
                <label>Which features did you find useful in the product? <br />(Check all that apply)</label>
                <div class="checkbox-group">
                    <label><input type="checkbox" name="features" value="Durability" /> Durability</label>
                    <label><input type="checkbox" name="features" value="Ease of Use" /> Ease of Use</label>
                    <label><input type="checkbox" name="features" value="Performance" /> Performance</label>
                    <label><input type="checkbox" name="features" value="Design" /> Design</label>
                </div>
            </div>

            <div class="form-group">
                <label for="writtenReview">Written Review <span class="optional">(Optional)</span></label>
                <textarea id="writtenReview" name="writtenReview" rows="5"></textarea>
            </div>

            <div class="form-group">
                <label for="userName">Your Name <span class="optional">(Optional)</span></label>
                <input type="text" id="userName" name="userName" />
            </div>

            <div class="form-group submit-group">
                <input type="submit" value="Post Review" />
            </div>
        </form>
    </main>


  <footer class="site-footer">
    <p>&copy; 2026 ♠️ Raphael Omonayin &middot; Nigeria ♠️ </p>
    <p>Last Modification: 08/01/2026</p>
  </footer>
</body>
</html>
